<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice · TraceBill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c10'/%3E%3Cpath d='M16 6l10 10-10 10L6 16z' fill='%234c8dff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="topbar">
  <span class="logo"><span class="tb-mark">◆</span> TraceBill</span>
  <span class="tenant">Invoice — read-only</span>
</div>
<div class="wrap">
  <div id="main"><div class="empty">Loading…</div></div>
  <p class="note" style="margin-top:24px">This invoice was shared with you by your vendor.
  Every line item is backed by per-request usage records — click a call line, then any record,
  to audit exactly what you were billed for. Powered by TraceBill.</p>
</div>
<script src="/assets/common.js"></script>
<script src="/assets/invoice-view.js"></script>
<script>
const token = location.pathname.split('/').pop();
(async () => {
  try {
    const inv = await api(`/share/${token}`);
    renderInvoice(document.getElementById('main'), inv, {
      receiptsFetcher: (lineId, cursor) =>
        api(`/share/${token}/lines/${lineId}/receipts?limit=100${cursor ? `&cursor=${cursor}` : ''}`),
      traceFetcher: (traceId) => api(`/share/${token}/traces/${traceId}`),
      onShare: null,
    });
  } catch {
    document.getElementById('main').innerHTML = '<div class="empty">This link is invalid or has been revoked.</div>';
  }
})();
</script>
</body>
</html>
