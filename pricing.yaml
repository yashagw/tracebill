# TraceBill price book. Prices are integer micro-dollars (1,000,000 = $1).
#
# Each tenant has a default price book, and any of their customers can have a
# contract that overrides part of it. SKUs merge key by key, so a contract can
# reprice one endpoint and inherit everything else. Compute, egress and quota
# replace wholesale when a contract names them.
#
# Editing this file applies on the next billing cycle. Closed invoices keep the
# price they were billed at, since every line stores its own unit price.

tenants:
  astro-store:
    currency: USD

    # ---- default rates: what a customer pays with no negotiated contract ----
    skus:
      # API call SKUs, named "<method>.<route>"
      "get./api/products":
        description: "Product catalog reads"
        unit_price_micros: 2000        # $0.002 / call
        free_units: 5                  # per period, per customer
      "post./api/checkout":
        description: "Checkout transactions"
        unit_price_micros: 20000       # $0.02 / call
        free_units: 0
      "get./api/slow":
        description: "Bulk export (slow path)"
        unit_price_micros: 50000       # $0.05 / call
        free_units: 0
      default:
        description: "API calls"
        unit_price_micros: 1000        # $0.001 / call
        free_units: 0
    compute:
      description: "Compute time"
      price_micros_per_second: 30000   # $0.03 / compute-second
    egress:
      description: "Data egress"
      price_micros_per_mb: 90000       # $0.09 / MB
    quota:
      calls_per_period: 400            # per customer, per period

    # ---- per-customer contracts ----
    customers:
      # Enterprise deal: volume rate on reads, a much larger free tier, and
      # cheaper compute. Kept on a small quota so enforcement is easy to demo.
      acme:
        skus:
          "get./api/products":
            description: "Product catalog reads (enterprise rate)"
            unit_price_micros: 1200    # $0.0012 / call
            free_units: 10             # double the standard tier
        compute:
          description: "Compute time"
          price_micros_per_second: 20000
        quota:
          calls_per_period: 20

      # Startup plan: discounted checkout, everything else at list price.
      initech:
        skus:
          "post./api/checkout":
            description: "Checkout transactions (startup plan)"
            unit_price_micros: 10000   # $0.01 / call
            free_units: 5

      # globex has no contract and pays the default rates above.
